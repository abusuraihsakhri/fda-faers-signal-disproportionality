name: Test and security verification

on:
  push:
    branches: [master, main, 'audit/**']
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,test]"
      - name: Compile Python sources
        run: python -m compileall -q agents faers_sentinel cli.py enrichment.py simulator.py
      - name: Run regression suite with ephemeral HMAC key
        shell: bash
        run: |
          export AUDIT_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          python -m pytest -v
      - name: Check static browser script syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          src = Path("web/index.html").read_text(encoding="utf-8")
          blocks = re.findall(r"<script[^>]*>([\s\S]*?)</script>", src)
          assert len(blocks) == 1, "Expected one inline JavaScript bundle"
          Path("/tmp/faers-browser.js").write_text(blocks[0], encoding="utf-8")
          PY
          node --check /tmp/faers-browser.js
