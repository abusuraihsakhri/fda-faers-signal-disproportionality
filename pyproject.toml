[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fda-faers-signal-disproportionality"
version = "2.1.0"
description = "Exploratory FAERS-style PRR, ROR and contingency-table reporting signals"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
test = ["pytest>=8,<10"]

[project.scripts]
fda-faers-signal-disproportionality = "faers_sentinel.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/fda-faers-signal-disproportionality"
Repository = "https://github.com/abusuraihsakhri/fda-faers-signal-disproportionality"

[tool.setuptools]
py-modules = ["cli", "simulator", "enrichment", "faers_sentinel_app"]

[tool.setuptools.packages.find]
include = ["agents*", "faers_sentinel*"]
