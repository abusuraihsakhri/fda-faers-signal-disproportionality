version: '3.8'

services:
  fda-faers-signal-disproportionality:
    build: .
    container_name: fda-faers-signal-disproportionality
    ports:
      - "8000:8000"
    environment:
      # IMPORTANT: Change this in production! Use a secrets manager or Docker secrets.
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:-change-me-in-production-use-strong-random-key}
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
